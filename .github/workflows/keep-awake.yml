name: Keep Streamlit App Awake

on:
  schedule:
    # Se ejecuta cada 5 días a la medianoche UTC
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Permite ejecutar el action manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer ping a la aplicación
        run: curl -s https://appasientosfem4py-hscfwqmwyszn2tmc9cq5rr.streamlit.app > /dev/null
