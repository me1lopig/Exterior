name: Micropilotes - pruebas
on:
  push:
    paths: ['micropilotes/**', '.github/workflows/micropilotes.yml']
  pull_request:
    paths: ['micropilotes/**', '.github/workflows/micropilotes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: micropilotes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - name: Streamlit smoke test
        run: python -m unittest discover -s smoke -v
