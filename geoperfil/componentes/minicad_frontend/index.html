<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --ink:#0a2239; --muted:#65758b; --line:#d9dfe6; --accent:#e45658; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font:13px Arial,sans-serif; background:white; }
    .shell { border:1px solid var(--line); border-radius:6px; overflow:hidden; background:white; }
    .toolbar { min-height:46px; display:flex; align-items:center; gap:5px; padding:6px 8px; border-bottom:1px solid var(--line); background:#fbfcfd; flex-wrap:wrap; }
    button,select,input { height:31px; border:1px solid #cbd3dc; border-radius:4px; background:white; color:var(--ink); padding:0 8px; }
    button { cursor:pointer; } button:hover { border-color:#8294a8; background:#f3f5f7; }
    button.active,button.primary { color:white; background:var(--accent); border-color:var(--accent); }
    button.danger { color:#a3292c; } button:disabled { opacity:.42; cursor:default; }
    .separator { width:1px; height:26px; background:var(--line); margin:0 2px; } .grow { flex:1; }
    .canvas-wrap { position:relative; height:610px; background:#fafbfc; overflow:hidden; }
    svg { width:100%; height:100%; display:block; touch-action:none; user-select:none; }
    .status { min-height:31px; display:flex; align-items:center; gap:16px; padding:5px 10px; border-top:1px solid var(--line); color:var(--muted); background:white; }
    .status span:last-child { margin-left:auto; } .dirty { color:#b6383b; font-weight:700; }
    .hint { position:absolute; right:10px; top:10px; padding:6px 8px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:4px; color:var(--muted); pointer-events:none; }
    .tooltip { position:absolute; display:none; padding:7px 9px; max-width:245px; background:#0a2239; color:white; border-radius:4px; line-height:1.35; pointer-events:none; box-shadow:0 3px 10px #0002; }
  </style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <button id="drawBtn" title="Dibujar una polilinea abierta">Introducir contacto</button>
    <button id="deleteContactBtn" class="danger" title="Eliminar un contacto abierto">Borrar contacto</button>
    <button id="lensBtn" title="Dibujar una polilinea cerrada">Introducir lentejon</button>
    <button id="deleteLensBtn" class="danger" title="Eliminar un lentejon cerrado">Borrar lentejon</button>
    <button id="finishBtn" disabled title="Finalizar el elemento en dibujo">Finalizar</button>
    <button id="paintBtn" title="Asignar unidad y trama a una zona">Rellenar</button>
    <button id="clearFillBtn" class="danger" title="Quitar unidad y trama de una zona">Borrar relleno</button>
    <button id="clearBtn" class="danger" title="Eliminar todos los contactos y rellenos">Limpiar todo</button>
    <div class="separator"></div>
    <button id="undoBtn" title="Deshacer (Ctrl+Z)">Deshacer</button>
    <button id="redoBtn" title="Rehacer (Ctrl+Y)">Rehacer</button>
    <button id="fitBtn" title="Encuadrar el perfil">Encuadrar</button>
    <button id="snapBtn" class="active" title="Ajuste magnetico; Alt lo omite temporalmente">Ajuste</button>
    <div class="separator"></div>
    <select id="unitSelect" title="Unidad activa"></select>
    <select id="hatchSelect" title="Trama activa"><option value="sin_trama">Sin trama</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="diagonal_45">Diagonal 45</option><option value="diagonal_135">Diagonal 135</option><option value="cruzada">Cruzada</option><option value="puntos">Puntos</option><option value="grava">Grava</option><option value="roca">Roca</option></select>
    <span class="grow"></span><button id="saveBtn" class="primary">Guardar interpretacion</button>
  </div>
  <div class="canvas-wrap">
    <svg id="cad" viewBox="0 0 1200 610" aria-label="Editor grafico del perfil"></svg>
    <div class="hint" id="hint">Pase sobre una interfaz de sondeo para ajustar el contacto</div><div class="tooltip" id="tooltip"></div>
  </div>
  <div class="status"><span id="coord">s: -- | z: --</span><span id="selection">Sin seleccion</span><span id="validation"></span><span id="state"></span></div>
</div>
<script>
(() => {
  const NS='http://www.w3.org/2000/svg',svg=document.getElementById('cad'),W=1200,H=610,M={l:58,r:22,t:24,b:46},CORAL='#e45658',SNAP_PX=14;

  function send(type,data={}){window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');} function setHeight(){send('streamlit:setFrameHeight',{height:760});} function setValue(value){send('streamlit:setComponentValue',{value,dataType:'json'});}

  function selectedContact(){return selection&&['contact','vertex'].includes(selection.type)?contacts[selection.ci]||null:null;} function selectedZone(){return selection?.type==='zone'?zones[selection.zi]:null;}

  function sx(x){return M.l+(x-viewport.xmin)/(viewport.xmax-viewport.xmin)*(W-M.l-M.r);} function sy(y){return M.t+(viewport.ymax-y)/(viewport.ymax-viewport.ymin)*(H-M.t-M.b);} function dx(x){return viewport.xmin+(x-M.l)/(W-M.l-M.r)*(viewport.xmax-viewport.xmin);} function dy(y){return viewport.ymax-(y-M.t)/(H-M.t-M.b)*(viewport.ymax-viewport.ymin);}

  function render(){svg.innerHTML='';addDefs();drawGrid();if(layers.zonas)drawZones();drawTerrain();if(layers.sondeos)drawBoreholes();if(layers.dpsh)drawDpsh();if(layers.contactos){drawReference();drawContacts();}drawDraft();drawObservedHover();const c=selectedContact(),z=selectedZone();$('undoBtn').disabled=!history.length&&!draft.length;$('redoBtn').disabled=!future.length;$('finishBtn').disabled=!(['draw','lens'].includes(mode))||draft.length<(mode==='lens'?3:2);$('selection').textContent=selection?.type==='vertex'?`Vertice ${selection.vi+1} de ${c.nombre}`:selection?.type==='contact'?`${isClosed(c)?'Lentejon':'Contacto'}: ${c.nombre}`:selection?.type==='zone'?`Zona: ${z.etiqueta||z.zona_id}`:['paint','clearFill'].includes(mode)?'Seleccione una zona':['deleteContact','deleteLens'].includes(mode)?'Seleccione el elemento que desea borrar':'Sin seleccion';$('validation').textContent=validationMessage();}

  function syncProperties(){const c=selectedContact();if(c?.unidad_inferior)$('unitSelect').value=c.unidad_inferior;}
  function activeUnit(){return model.unidades.find(x=>x.unidad_id===$('unitSelect').value)||{};}
  function finalizeDraft(){if(draft.length<(mode==='lens'?3:2))return;pushHistory();const lens=mode==='lens',id=`${lens?'lente':'contacto'}_${Date.now()}`,v=clone(draft),u=activeUnit();if(lens)v.push(clone(v[0]));contacts.push({contacto_id:id,nombre:lens?`Lentejon ${u.nombre||'interpretado'}`:`Contacto ${u.nombre||'interpretado'}`,unidad_superior:'',unidad_inferior:u.unidad_id||'',color:u.color||'#334155',vertices:v,visible:true,bloqueado:false,evidencia:'interpretado',incertidumbre_m:0});selection={type:'contact',ci:contacts.length-1};draft=[];markDirty(true);setMode('select');syncProperties();}
  function nearestSegmentIndex(c,p){let best={i:1,d:Infinity};for(let i=0;i<c.vertices.length-1;i++){const d=distanceSegment(p,c.vertices[i],c.vertices[i+1]);if(d<best.d)best={i:i+1,d};}return best.i;}
  function deleteSelection(){const c=selectedContact();if(c?.bloqueado)return;if(selection?.type==='vertex'){pushHistory();if(c.vertices.length<=2){contacts.splice(selection.ci,1);selection=null;}else{c.vertices.splice(selection.vi,1);selection={type:'contact',ci:selection.ci};}markDirty(true);}else if(selection?.type==='contact'){pushHistory();contacts.splice(selection.ci,1);selection=null;markDirty(true);}else if(selection?.type==='zone'){pushHistory();const z=selectedZone();z.unidad_id='';z.trama='sin_trama';z.color='#D9DDE2';markDirty();}syncProperties();render();}
  svg.addEventListener('pointerdown',e=>{const sp=pointer(e),p=dataPoint(e);$('coord').textContent=`s: ${p.s_m.toFixed(2)} m | z: ${p.z_m.toFixed(2)} m`;if(e.button===1||e.shiftKey){pan={p:sp,view:clone(viewport)};svg.setPointerCapture(e.pointerId);return;}if(['draw','lens'].includes(mode)){if(e.detail>1||!inPlot(sp))return;draft.push(snapped(p,e.altKey));markDirty();render();return;}const hit=hitTest(p);if(mode==='paint'){if(hit?.type==='zone'){pushHistory();const u=activeUnit(),z=zones[hit.zi];z.unidad_id=u.unidad_id||'';z.color=u.color||'#D9DDE2';z.trama=$('hatchSelect').value;selection=hit;markDirty();render();}return;}if(mode==='clearFill'){if(hit?.type==='zone'){pushHistory();const z=zones[hit.zi];z.unidad_id='';z.color='#D9DDE2';z.trama='sin_trama';selection=hit;markDirty();render();}return;}if(['deleteContact','deleteLens'].includes(mode)){if(hit&&['contact','vertex'].includes(hit.type)){const c=contacts[hit.ci],expectedLens=mode==='deleteLens';if(isClosed(c)===expectedLens&&!c.bloqueado){pushHistory();contacts.splice(hit.ci,1);selection=null;markDirty(true);render();}else{$('selection').textContent=expectedLens?'El elemento elegido no es un lentejon':'El elemento elegido es un lentejon';}}return;}selection=hit;if(hit?.type==='vertex'&&!contacts[hit.ci].bloqueado&&contacts[hit.ci].vertices[hit.vi].origen!=='observado'){pushHistory();drag={ci:hit.ci,vi:hit.vi};svg.setPointerCapture(e.pointerId);}syncProperties();render();});
  svg.addEventListener('pointermove',e=>{const sp=pointer(e),p=dataPoint(e);$('coord').textContent=`s: ${p.s_m.toFixed(2)} m | z: ${p.z_m.toFixed(2)} m`;if(pan){const rx=(sp.x-pan.p.x)/(W-M.l-M.r)*(pan.view.xmax-pan.view.xmin),ry=(sp.y-pan.p.y)/(H-M.t-M.b)*(pan.view.ymax-pan.view.ymin);viewport={xmin:pan.view.xmin-rx,xmax:pan.view.xmax-rx,ymin:pan.view.ymin+ry,ymax:pan.view.ymax+ry};render();return;}if(drag){contacts[drag.ci].vertices[drag.vi]=snapped(p,e.altKey);markDirty(true);render();return;}const next=(!snap||e.altKey?null:nearestObserved(p))||hitTest(p);if(JSON.stringify(next)!==JSON.stringify(hover)){hover=next;render();}});svg.addEventListener('pointerleave',()=>{if(!drag&&!pan){hover=null;render();}});svg.addEventListener('pointerup',()=>{drag=null;pan=null;render();});
  svg.addEventListener('dblclick',e=>{e.preventDefault();if(['draw','lens'].includes(mode)){finalizeDraft();return;}if(mode!=='select')return;const p=dataPoint(e),hit=hitTest(p);if(!hit||!['contact','vertex'].includes(hit.type)||contacts[hit.ci].bloqueado)return;pushHistory();const q=snapped(p,e.altKey),idx=nearestSegmentIndex(contacts[hit.ci],q);contacts[hit.ci].vertices.splice(idx,0,q);selection={type:'vertex',ci:hit.ci,vi:idx};markDirty(true);syncProperties();render();});svg.addEventListener('wheel',e=>{e.preventDefault();const p=dataPoint(e),f=e.deltaY>0?1.15:.87;viewport={xmin:p.s_m+(viewport.xmin-p.s_m)*f,xmax:p.s_m+(viewport.xmax-p.s_m)*f,ymin:p.z_m+(viewport.ymin-p.z_m)*f,ymax:p.z_m+(viewport.ymax-p.z_m)*f};render();},{passive:false});
  $('drawBtn').onclick=()=>{draft=[];selection=null;setMode('draw');};$('deleteContactBtn').onclick=()=>{draft=[];selection=null;setMode('deleteContact');};$('lensBtn').onclick=()=>{draft=[];selection=null;setMode('lens');};$('deleteLensBtn').onclick=()=>{draft=[];selection=null;setMode('deleteLens');};$('paintBtn').onclick=()=>setMode('paint');$('clearFillBtn').onclick=()=>setMode('clearFill');$('finishBtn').onclick=finalizeDraft;$('fitBtn').onclick=()=>{viewport=clone(initialBounds);render();};$('snapBtn').onclick=()=>{snap=!snap;$('snapBtn').classList.toggle('active',snap);};
  $('undoBtn').onclick=()=>{if(draft.length){draft.pop();render();return;}if(history.length){future.push(snapshot());restore(history.pop());}};$('redoBtn').onclick=()=>{if(future.length){history.push(snapshot());restore(future.pop());}};
  $('clearBtn').onclick=()=>{if(!(contacts.length||zones.length)||!confirm('Se eliminaran todos los contactos y rellenos. Los sondeos y DPSH se conservaran.'))return;pushHistory();contacts=[];zones=[];selection=null;topologyDirty=false;clearedAll=true;markDirty();syncProperties();render();};
  $('saveBtn').onclick=()=>{setValue({action:'save',event_id:Date.now(),contactos:contacts,zonas:zones,limpiar_interpretacion:clearedAll});dirty=false;$('state').textContent='Guardado enviado a Python';$('state').className='';lastModelSignature='';};window.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='Delete'){e.preventDefault();deleteSelection();}else if(e.key==='Escape'){draft=[];setMode('select');}else if(e.key==='Enter'&&['draw','lens'].includes(mode))finalizeDraft();else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('undoBtn').click();}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('redoBtn').click();}});
})();
