<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --ink:#0a2239; --muted:#65758b; --line:#d9dfe6; --accent:#e45658; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font:13px Arial,sans-serif; background:white; }
    .shell { border:1px solid var(--line); border-radius:6px; overflow:hidden; background:white; }
    .toolbar { min-height:46px; display:flex; align-items:center; gap:5px; padding:6px 8px; border-bottom:1px solid var(--line); background:#fbfcfd; flex-wrap:wrap; }
    button,select,input { height:31px; border:1px solid #cbd3dc; border-radius:4px; background:white; color:var(--ink); padding:0 8px; }
    button { cursor:pointer; } button:hover { border-color:#8294a8; background:#f3f5f7; }
    button.active,button.primary { color:white; background:var(--accent); border-color:var(--accent); }
    button.danger { color:#a3292c; } button:disabled { opacity:.42; cursor:default; }
    input[type="color"] { width:35px; padding:3px; } input[type="number"] { width:72px; } #nameInput { width:150px; }
    .separator { width:1px; height:26px; background:var(--line); margin:0 2px; } .grow { flex:1; }
    .canvas-wrap { position:relative; height:610px; background:#fafbfc; overflow:hidden; }
    svg { width:100%; height:100%; display:block; touch-action:none; user-select:none; }
    .status { min-height:31px; display:flex; align-items:center; gap:16px; padding:5px 10px; border-top:1px solid var(--line); color:var(--muted); background:white; }
    .status span:last-child { margin-left:auto; } .dirty { color:#b6383b; font-weight:700; }
    .hint { position:absolute; right:10px; top:10px; padding:6px 8px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:4px; color:var(--muted); pointer-events:none; }
    .tooltip { position:absolute; display:none; padding:7px 9px; max-width:245px; background:#0a2239; color:white; border-radius:4px; line-height:1.35; pointer-events:none; box-shadow:0 3px 10px #0002; }
    .panel { position:absolute; right:8px; top:8px; bottom:8px; width:270px; padding:10px; background:rgba(255,255,255,.97); border:1px solid var(--line); border-radius:5px; box-shadow:0 6px 18px #0a22391f; overflow:auto; }
    .panel.hidden { display:none; } .panel-head { display:flex; align-items:center; margin-bottom:8px; } .panel-head strong { flex:1; } .panel-head button { width:30px; padding:0; }
    .layer-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding-bottom:9px; border-bottom:1px solid var(--line); }
    .layer-grid label { display:flex; gap:5px; align-items:center; color:var(--muted); } .layer-grid input { height:auto; }
    .tree-row { display:grid; grid-template-columns:1fr 27px 27px; gap:4px; align-items:center; margin-top:5px; }
    .tree-row button { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .tree-row button.selected { border-color:var(--accent); color:#b6383b; background:#fff4f4; }
    .section-title { margin-top:12px; color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; }
  </style>
</head>
<body>
<div class="shell">
  <div class="toolbar">
    <button id="selectBtn" class="active" title="Seleccionar y editar">Seleccionar</button>
    <button id="drawBtn" title="Dibujar una polilinea abierta">Contacto</button>
    <button id="lensBtn" title="Dibujar una lente cerrada">Lente</button>
    <button id="finishBtn" disabled title="Finalizar el elemento en dibujo">Finalizar</button>
    <button id="paintBtn" title="Asignar unidad y trama a una zona">Rellenar</button>
    <div class="separator"></div>
    <button id="splitBtn" title="Dividir el contacto en el vertice seleccionado">Dividir</button>
    <button id="joinBtn" title="Unir dos contactos por sus extremos mas proximos">Unir</button>
    <button id="deleteBtn" class="danger" title="Eliminar el elemento seleccionado">Eliminar</button>
    <button id="clearBtn" class="danger" title="Eliminar todos los contactos y rellenos">Limpiar todo</button>
    <div class="separator"></div>
    <button id="undoBtn" title="Deshacer (Ctrl+Z)">Deshacer</button>
    <button id="redoBtn" title="Rehacer (Ctrl+Y)">Rehacer</button>
    <button id="fitBtn" title="Encuadrar el perfil">Encuadrar</button>
    <button id="snapBtn" class="active" title="Ajuste magnetico; Alt lo omite temporalmente">Ajuste</button>
    <button id="panelBtn" title="Capas y arbol de elementos">Elementos</button>
    <div class="separator"></div>
    <select id="unitSelect" title="Unidad activa"></select>
    <select id="hatchSelect" title="Trama activa"><option value="sin_trama">Sin trama</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="diagonal_45">Diagonal 45</option><option value="diagonal_135">Diagonal 135</option><option value="cruzada">Cruzada</option><option value="puntos">Puntos</option><option value="grava">Grava</option><option value="roca">Roca</option></select>
    <input id="nameInput" placeholder="Nombre del contacto" title="Nombre del contacto">
    <select id="evidenceSelect" title="Evidencia del contacto"><option value="interpretado">Interpretado</option><option value="proyectado">Proyectado</option><option value="observado">Observado</option></select>
    <input id="uncertaintyInput" type="number" min="0" step="0.1" value="0" title="Incertidumbre grafica (m)">
    <input id="colorInput" type="color" value="#334155" title="Color del contacto">
    <span class="grow"></span><button id="saveBtn" class="primary">Guardar interpretacion</button>
  </div>
  <div class="canvas-wrap">
    <svg id="cad" viewBox="0 0 1200 610" aria-label="Editor grafico del perfil"></svg>
    <div class="hint" id="hint">Doble clic en un contacto: insertar vertice</div><div class="tooltip" id="tooltip"></div>
    <div class="panel hidden" id="panel"><div class="panel-head"><strong>Capas y elementos</strong><button id="closePanel" title="Cerrar">X</button></div><div class="layer-grid" id="layers"></div><div id="tree"></div></div>
  </div>
  <div class="status"><span id="coord">s: -- | z: --</span><span id="selection">Sin seleccion</span><span id="validation"></span><span id="state"></span></div>
</div>
<script>
(() => {
  const NS='http://www.w3.org/2000/svg',svg=document.getElementById('cad'),W=1200,H=610,M={l:58,r:22,t:24,b:46},CORAL='#e45658';
  let model=null,contacts=[],zones=[],viewport=null,initialBounds=null,selection=null,hover=null,mode='select',draft=[],drag=null,pan=null,joinBase=null;
  let snap=true,dirty=false,topologyDirty=false,clearedAll=false,history=[],future=[],lastModelSignature='',layers={zonas:true,sondeos:true,dpsh:true,contactos:true};
  const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
  const el=(tag,attrs={})=>{const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n;};
  function send(type,data={}){window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');} function setHeight(){send('streamlit:setFrameHeight',{height:760});} function setValue(value){send('streamlit:setComponentValue',{value,dataType:'json'});}
  function signature(m){return JSON.stringify([m.bounds,m.contactos,m.contactos_referencia,m.zonas,m.unidades,m.observados]);}

  window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;const m=e.data.args.model,sig=signature(m);if(!model||(!dirty&&sig!==lastModelSignature)){lastModelSignature=sig;initialize(m);}setHeight();});send('streamlit:componentReady',{apiVersion:1});setHeight();
  function buildUnits(){const s=$('unitSelect');s.innerHTML='';(model.unidades||[]).forEach(u=>{const o=document.createElement('option');o.value=u.unidad_id;o.textContent=u.nombre;s.appendChild(o);});}
  function selectedContact(){return selection&&['contact','vertex'].includes(selection.type)?contacts[selection.ci]||null:null;} function selectedZone(){return selection?.type==='zone'?zones[selection.zi]:null;}
  function snapshot(){return{contacts:clone(contacts),zones:clone(zones),topologyDirty,clearedAll,selection:clone(selection)};} function pushHistory(){history.push(snapshot());if(history.length>80)history.shift();future=[];} function restore(x){contacts=clone(x.contacts);zones=clone(x.zones);topologyDirty=!!x.topologyDirty;clearedAll=!!x.clearedAll;selection=clone(x.selection);dirty=true;syncProperties();render();}
  function markDirty(geometry=false){dirty=true;if(geometry){topologyDirty=true;clearedAll=false;}$('state').textContent=topologyDirty?'Geometria pendiente de recalcular':'Cambios sin guardar';$('state').className='dirty';}
  function sx(x){return M.l+(x-viewport.xmin)/(viewport.xmax-viewport.xmin)*(W-M.l-M.r);} function sy(y){return M.t+(viewport.ymax-y)/(viewport.ymax-viewport.ymin)*(H-M.t-M.b);} function dx(x){return viewport.xmin+(x-M.l)/(W-M.l-M.r)*(viewport.xmax-viewport.xmin);} function dy(y){return viewport.ymax-(y-M.t)/(H-M.t-M.b)*(viewport.ymax-viewport.ymin);}
  function pointer(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};} function dataPoint(e){const p=pointer(e);return{s_m:dx(p.x),z_m:dy(p.y),origen:'interpretado',referencia:'',interfaz_id:''};} function screenDistance(a,b){return Math.hypot(sx(a.s_m)-sx(b.s_m),sy(a.z_m)-sy(b.z_m));}
  function projectedPoint(p,a,b){const px=sx(p.s_m),py=sy(p.z_m),ax=sx(a.s_m),ay=sy(a.z_m),bx=sx(b.s_m),by=sy(b.z_m),vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy,t=l2?Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/l2)):0;return{s_m:a.s_m+t*(b.s_m-a.s_m),z_m:a.z_m+t*(b.z_m-a.z_m),origen:'interpretado',referencia:'',interfaz_id:''};}
  function snapped(p,bypass=false){if(!snap||bypass)return p;let best=null,bd=14;const observed=(model.observados||[]).map(q=>({...q,_observed:true})),vertices=contacts.flatMap((c,ci)=>c.visible===false||ci===selection?.ci?[]:(c.vertices||[]).map(q=>({...q,_observed:false})));[...observed,...vertices].forEach(q=>{const d=screenDistance(q,p);if(d<bd){bd=d;best=q;}});const lineas=[model.terreno||[],...contacts.filter((c,ci)=>c.visible!==false&&ci!==selection?.ci).map(c=>c.vertices||[])];lineas.forEach(linea=>{for(let i=0;i<linea.length-1;i++){const q=projectedPoint(p,linea[i],linea[i+1]),d=screenDistance(q,p);if(d<bd){bd=d;best=q;}}});return best?{s_m:best.s_m,z_m:best.z_m,origen:best._observed?'observado':best.origen||'interpretado',referencia:best.referencia||'',interfaz_id:best.interfaz_id||''}:p;}
  function distanceSegment(p,a,b){const px=sx(p.s_m),py=sy(p.z_m),ax=sx(a.s_m),ay=sy(a.z_m),bx=sx(b.s_m),by=sy(b.z_m),vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy,t=l2?Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/l2)):0;return Math.hypot(px-(ax+t*vx),py-(ay+t*vy));}
  function pointInPolygon(p,c){let inside=false;for(let i=0,j=c.length-1;i<c.length;j=i++){const xi=c[i][0],yi=c[i][1],xj=c[j][0],yj=c[j][1];if(((yi>p.z_m)!==(yj>p.z_m))&&(p.s_m<(xj-xi)*(p.z_m-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
  function hitTest(p){if(layers.contactos){for(let ci=contacts.length-1;ci>=0;ci--){const c=contacts[ci];if(c.visible===false)continue;for(let vi=c.vertices.length-1;vi>=0;vi--)if(screenDistance(p,c.vertices[vi])<=9)return{type:'vertex',ci,vi};}let best=null,bd=8;contacts.forEach((c,ci)=>{if(c.visible===false)return;for(let i=0;i<c.vertices.length-1;i++){const d=distanceSegment(p,c.vertices[i],c.vertices[i+1]);if(d<bd){bd=d;best={type:'contact',ci};}}});if(best)return best;}if(layers.zonas&&!topologyDirty){const order=zones.map((z,zi)=>({z,zi})).sort((a,b)=>(a.z.area_m2||Infinity)-(b.z.area_m2||Infinity));for(const x of order)if(pointInPolygon(p,x.z.coordenadas||[]))return{type:'zone',zi:x.zi};}return null;}

  function render(){svg.innerHTML='';addDefs();drawGrid();if(layers.zonas)drawZones();drawTerrain();if(layers.sondeos)drawBoreholes();if(layers.dpsh)drawDpsh();if(layers.contactos){drawReference();drawContacts();}drawDraft();drawObservedHover();const c=selectedContact(),z=selectedZone();$('undoBtn').disabled=!history.length;$('redoBtn').disabled=!future.length;$('splitBtn').disabled=!(selection?.type==='vertex'&&selection.vi>0&&selection.vi<c.vertices.length-1&&!c.bloqueado);$('joinBtn').disabled=!c;$('deleteBtn').disabled=!selection||!!c?.bloqueado;$('finishBtn').disabled=!(['draw','lens'].includes(mode))||draft.length<(mode==='lens'?3:2);$('selection').textContent=selection?.type==='vertex'?`Vertice ${selection.vi+1} de ${c.nombre}`:selection?.type==='contact'?`Contacto: ${c.nombre}`:selection?.type==='zone'?`Zona: ${z.etiqueta||z.zona_id}`:mode==='paint'?'Seleccione una zona':'Sin seleccion';$('validation').textContent=validationMessage();buildPanel();}
  function addDefs(){const defs=el('defs'),patterns={horizontal:'<path d="M0 5H12" stroke="#364152"/>',vertical:'<path d="M5 0V12" stroke="#364152"/>',diagonal_45:'<path d="M-2 12L12-2M4 14L14 4" stroke="#364152"/>',diagonal_135:'<path d="M-2 0L12 14M4-2L14 8" stroke="#364152"/>',cruzada:'<path d="M0 5H12M5 0V12" stroke="#364152"/>',puntos:'<circle cx="4" cy="4" r="1.2" fill="#364152"/>',grava:'<circle cx="3" cy="4" r="2" fill="none" stroke="#364152"/><circle cx="10" cy="10" r="2.5" fill="none" stroke="#364152"/>',roca:'<path d="M1 10L5 3L10 5L13 11Z" fill="none" stroke="#364152"/>'};Object.entries(patterns).forEach(([id,html])=>{const p=el('pattern',{id:`pat-${id}`,width:12,height:12,patternUnits:'userSpaceOnUse'});p.innerHTML=html;defs.appendChild(p);});svg.appendChild(defs);}
  function drawGrid(){const g=el('g',{stroke:'#e1e5ea','stroke-width':1});for(let i=0;i<=10;i++){const x=M.l+i*(W-M.l-M.r)/10;g.appendChild(el('line',{x1:x,y1:M.t,x2:x,y2:H-M.b}));}for(let i=0;i<=6;i++){const y=M.t+i*(H-M.t-M.b)/6;g.appendChild(el('line',{x1:M.l,y1:y,x2:W-M.r,y2:y}));}svg.appendChild(g);const a=el('g',{'font-size':11,fill:'#65758b'});for(let i=0;i<=5;i++){const x=M.l+i*(W-M.l-M.r)/5,v=viewport.xmin+i*(viewport.xmax-viewport.xmin)/5,t=el('text',{x,y:H-18,'text-anchor':'middle'});t.textContent=v.toFixed(1);a.appendChild(t);}for(let i=0;i<=5;i++){const y=M.t+i*(H-M.t-M.b)/5,v=viewport.ymax-i*(viewport.ymax-viewport.ymin)/5,t=el('text',{x:M.l-8,y:y+4,'text-anchor':'end'});t.textContent=v.toFixed(1);a.appendChild(t);}svg.appendChild(a);}
  function points(a){return a.map(p=>`${sx(p.s_m??p[0])},${sy(p.z_m??p[1])}`).join(' ');} function zonePath(z){return[z.coordenadas||[],...(z.huecos||[])].filter(r=>r.length).map(r=>`M ${r.map(p=>`${sx(p[0])} ${sy(p[1])}`).join(' L ')} Z`).join(' ');}
  function drawZones(){if(topologyDirty)return;const g=el('g');zones.map((z,i)=>({z,i})).sort((a,b)=>(b.z.area_m2||0)-(a.z.area_m2||0)).forEach(({z,i})=>{const selected=selection?.type==='zone'&&selection.zi===i,hot=hover?.type==='zone'&&hover.zi===i,path=zonePath(z),stroke=selected?CORAL:hot?'#e88b8d':'#bac3cd';g.appendChild(el('path',{d:path,fill:z.color||'#d9dde2','fill-opacity':selected ? .72 : .55,stroke,'stroke-width':selected?2:hot?1.4:.7,'fill-rule':'evenodd'}));if(z.trama&&z.trama!=='sin_trama')g.appendChild(el('path',{d:path,fill:`url(#pat-${z.trama})`,'fill-opacity':.65,stroke:'none','fill-rule':'evenodd'}));if(z.centro_s_m!==undefined){const t=el('text',{x:sx(z.centro_s_m),y:sy(z.centro_z_m),'text-anchor':'middle','font-size':11,fill:'#243447','pointer-events':'none'});t.textContent=`${z.etiqueta||'Z'} ${z.unidad_id||'?'}`;g.appendChild(t);}});svg.appendChild(g);}

  function drawContacts(){const g=el('g');contacts.forEach((c,ci)=>{if(c.visible===false)return;const selected=selection&&selection.ci===ci&&['contact','vertex'].includes(selection.type),hot=hover&&hover.ci===ci&&['contact','vertex'].includes(hover.type),color=selected?CORAL:hot?'#e88b8d':c.color||'#334155';if(c.incertidumbre_m>0){const px=Math.max(2,c.incertidumbre_m/(viewport.ymax-viewport.ymin)*(H-M.t-M.b)*2);g.appendChild(el('polyline',{points:points(c.vertices||[]),fill:'none',stroke:color,'stroke-width':px,'stroke-opacity':.1}));}g.appendChild(el('polyline',{points:points(c.vertices||[]),fill:'none',stroke:color,'stroke-width':selected?3.2:hot?2.8:2,'stroke-dasharray':contactDash(c)}));if(selected)c.vertices.forEach((p,vi)=>{const vsel=selection.type==='vertex'&&selection.vi===vi;g.appendChild(el('circle',{cx:sx(p.s_m),cy:sy(p.z_m),r:vsel?7:5.5,fill:vsel?CORAL:p.origen==='observado'?'#0a2239':'white',stroke:vsel?CORAL:color,'stroke-width':2}));});if(c.bloqueado&&c.vertices.length){const p=c.vertices[0],t=el('text',{x:sx(p.s_m)+7,y:sy(p.z_m)-7,'font-size':11,fill:'#65758b'});t.textContent='[B]';g.appendChild(t);}});svg.appendChild(g);}
  function drawDraft(){if(!draft.length)return;const p=mode==='lens'&&draft.length>2?[...draft,draft[0]]:draft;svg.appendChild(el('polyline',{points:points(p),fill:mode==='lens'?'#e4565812':'none',stroke:CORAL,'stroke-width':2,'stroke-dasharray':'6 4'}));draft.forEach(q=>svg.appendChild(el('circle',{cx:sx(q.s_m),cy:sy(q.z_m),r:5,fill:'white',stroke:CORAL,'stroke-width':2})));}
  function drawObservedHover(){if(hover?.type!=='observed'){$('tooltip').style.display='none';return;}const o=model.observados[hover.oi],g=el('g');g.appendChild(el('circle',{cx:sx(o.s_m),cy:sy(o.z_m),r:11,fill:'#e4565820',stroke:CORAL}));g.appendChild(el('line',{x1:sx(o.s_m)-7,y1:sy(o.z_m)-7,x2:sx(o.s_m)+7,y2:sy(o.z_m)+7,stroke:CORAL,'stroke-width':2.5}));g.appendChild(el('line',{x1:sx(o.s_m)-7,y1:sy(o.z_m)+7,x2:sx(o.s_m)+7,y2:sy(o.z_m)-7,stroke:CORAL,'stroke-width':2.5}));svg.appendChild(g);const t=$('tooltip');t.innerHTML=`<strong>${o.referencia}</strong><br>Profundidad: ${Number(o.profundidad_m).toFixed(2)} m<br>Cota: ${Number(o.z_m).toFixed(2)} m<br>${o.unidad_superior} / ${o.unidad_inferior}`;t.style.left=`${Math.min(sx(o.s_m)/W*100+2,80)}%`;t.style.top=`${Math.max(sy(o.z_m)-25,8)}px`;t.style.display='block';}
  function cross(a,b,c){return(b.s_m-a.s_m)*(c.z_m-a.z_m)-(b.z_m-a.z_m)*(c.s_m-a.s_m);} function segmentsCross(a,b,c,d){return cross(a,b,c)*cross(a,b,d)<0&&cross(c,d,a)*cross(c,d,b)<0;} function validationMessage(){let invalid=0;contacts.forEach(c=>{for(let i=0;i<c.vertices.length-1;i++)for(let j=i+2;j<c.vertices.length-1;j++)if(!(i===0&&j===c.vertices.length-2&&screenDistance(c.vertices[0],c.vertices.at(-1))<.1)&&segmentsCross(c.vertices[i],c.vertices[i+1],c.vertices[j],c.vertices[j+1]))invalid++;});return invalid?`${invalid} autointerseccion(es)`:topologyDirty?'Rellenos ocultos hasta guardar':'';}
  function setMode(next){mode=next;if(next!=='join')joinBase=null;['select','draw','lens','paint'].forEach(m=>$(m+'Btn').classList.toggle('active',m===next));$('hint').textContent=next==='draw'?'Pulse para crear vertices; Enter finaliza':next==='lens'?'Dibuje el contorno de la lente; se cerrara al finalizar':next==='paint'?'Seleccione una zona para asignar unidad y trama':next==='join'?'Seleccione el segundo contacto':'Doble clic en un contacto: insertar vertice';render();}
  function syncProperties(){const c=selectedContact();$('nameInput').value=c?.nombre||'';$('colorInput').value=c?.color||'#334155';$('evidenceSelect').value=c?.evidencia||'interpretado';$('uncertaintyInput').value=c?.incertidumbre_m||0;if(c?.unidad_inferior)$('unitSelect').value=c.unidad_inferior;}
  function finalizeDraft(){if(draft.length<(mode==='lens'?3:2))return;pushHistory();const lens=mode==='lens',id=`${lens?'lente':'contacto'}_${Date.now()}`,v=clone(draft);if(lens)v.push(clone(v[0]));contacts.push({contacto_id:id,nombre:$('nameInput').value||(lens?'Lente interpretada':'Contacto interpretado'),unidad_superior:'',unidad_inferior:$('unitSelect').value,color:$('colorInput').value,vertices:v,visible:true,bloqueado:false,evidencia:'interpretado',incertidumbre_m:0});selection={type:'contact',ci:contacts.length-1};draft=[];markDirty(true);setMode('select');syncProperties();}
  function nearestSegmentIndex(c,p){let best={i:1,d:Infinity};for(let i=0;i<c.vertices.length-1;i++){const d=distanceSegment(p,c.vertices[i],c.vertices[i+1]);if(d<best.d)best={i:i+1,d};}return best.i;}
  function deleteSelection(){const c=selectedContact();if(c?.bloqueado)return;if(selection?.type==='vertex'){pushHistory();if(c.vertices.length<=2){contacts.splice(selection.ci,1);selection=null;}else{c.vertices.splice(selection.vi,1);selection={type:'contact',ci:selection.ci};}markDirty(true);}else if(selection?.type==='contact'){pushHistory();contacts.splice(selection.ci,1);selection=null;markDirty(true);}else if(selection?.type==='zone'){pushHistory();const z=selectedZone();z.unidad_id='';z.trama='sin_trama';z.color='#D9DDE2';markDirty();}syncProperties();render();}
  function splitContact(){const c=selectedContact(),vi=selection?.vi;if(!c||c.bloqueado||selection.type!=='vertex'||vi<=0||vi>=c.vertices.length-1)return;pushHistory();const b=clone(c),stamp=Date.now();b.contacto_id=`${c.contacto_id}_b_${stamp}`;b.nombre=`${c.nombre} (B)`;b.vertices=c.vertices.slice(vi);c.nombre=`${c.nombre} (A)`;c.vertices=c.vertices.slice(0,vi+1);contacts.splice(selection.ci+1,0,b);selection={type:'contact',ci:selection.ci};markDirty(true);syncProperties();render();}
  function joinContacts(i,j){if(i===j)return;const a=contacts[i],b=contacts[j];if(!a||!b||a.bloqueado||b.bloqueado)return;const variants=[[a.vertices,b.vertices],[a.vertices,[...b.vertices].reverse()],[[...a.vertices].reverse(),b.vertices],[[...a.vertices].reverse(),[...b.vertices].reverse()]],best=variants.sort((x,y)=>screenDistance(x[0].at(-1),x[1][0])-screenDistance(y[0].at(-1),y[1][0]))[0];pushHistory();a.vertices=[...clone(best[0]),...clone(best[1]).slice(screenDistance(best[0].at(-1),best[1][0])<1?1:0)];contacts.splice(j,1);selection={type:'contact',ci:contacts.indexOf(a)};markDirty(true);setMode('select');syncProperties();}
  function buildPanel(){const names={zonas:'Rellenos',sondeos:'Sondeos',dpsh:'DPSH',contactos:'Contactos'},box=$('layers');box.innerHTML='';Object.entries(names).forEach(([k,v])=>{const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.checked=layers[k];i.onchange=()=>{layers[k]=i.checked;render();};l.append(i,document.createTextNode(v));box.appendChild(l);});const tree=$('tree');tree.innerHTML='<div class="section-title">Contactos</div>';contacts.forEach((c,ci)=>{const row=document.createElement('div');row.className='tree-row';const name=document.createElement('button');name.textContent=c.nombre;name.title=c.nombre;if(selection?.ci===ci&&['contact','vertex'].includes(selection.type))name.className='selected';name.onclick=()=>{selection={type:'contact',ci};syncProperties();render();};const eye=document.createElement('button');eye.textContent=c.visible===false?'O':'V';eye.title=c.visible===false?'Mostrar':'Ocultar';eye.onclick=()=>{pushHistory();c.visible=c.visible===false;markDirty();render();};const lock=document.createElement('button');lock.textContent=c.bloqueado?'B':'-';lock.title=c.bloqueado?'Desbloquear':'Bloquear';lock.onclick=()=>{pushHistory();c.bloqueado=!c.bloqueado;markDirty();render();};row.append(name,eye,lock);tree.appendChild(row);});tree.insertAdjacentHTML('beforeend','<div class="section-title">Zonas</div>');zones.forEach((z,zi)=>{const row=document.createElement('div'),b=document.createElement('button');row.className='tree-row';row.style.gridTemplateColumns='1fr';b.textContent=`${z.etiqueta||z.zona_id} - ${z.unidad_id||'sin asignar'}`;if(selection?.type==='zone'&&selection.zi===zi)b.className='selected';b.onclick=()=>{selection={type:'zone',zi};render();};row.appendChild(b);tree.appendChild(row);});}
  svg.addEventListener('pointerdown',e=>{const sp=pointer(e),p=dataPoint(e);$('coord').textContent=`s: ${p.s_m.toFixed(2)} m | z: ${p.z_m.toFixed(2)} m`;if(e.button===1||e.shiftKey){pan={p:sp,view:clone(viewport)};svg.setPointerCapture(e.pointerId);return;}if(['draw','lens'].includes(mode)){draft.push(snapped(p,e.altKey));markDirty();render();return;}const hit=hitTest(p);if(mode==='join'){if(hit&&['contact','vertex'].includes(hit.type))joinContacts(joinBase,hit.ci);return;}if(mode==='paint'){if(hit?.type==='zone'){pushHistory();const u=model.unidades.find(x=>x.unidad_id===$('unitSelect').value),z=zones[hit.zi];z.unidad_id=u?.unidad_id||'';z.color=u?.color||'#D9DDE2';z.trama=$('hatchSelect').value;selection=hit;markDirty();render();}return;}selection=hit;if(hit?.type==='vertex'&&!contacts[hit.ci].bloqueado){pushHistory();drag={ci:hit.ci,vi:hit.vi};svg.setPointerCapture(e.pointerId);}syncProperties();render();});
  svg.addEventListener('pointermove',e=>{const sp=pointer(e),p=dataPoint(e);$('coord').textContent=`s: ${p.s_m.toFixed(2)} m | z: ${p.z_m.toFixed(2)} m`;if(pan){const rx=(sp.x-pan.p.x)/(W-M.l-M.r)*(pan.view.xmax-pan.view.xmin),ry=(sp.y-pan.p.y)/(H-M.t-M.b)*(pan.view.ymax-pan.view.ymin);viewport={xmin:pan.view.xmin-rx,xmax:pan.view.xmax-rx,ymin:pan.view.ymin+ry,ymax:pan.view.ymax+ry};render();return;}if(drag){contacts[drag.ci].vertices[drag.vi]=snapped(p,e.altKey);markDirty(true);render();return;}const next=nearestObserved(p)||hitTest(p);if(JSON.stringify(next)!==JSON.stringify(hover)){hover=next;render();}});svg.addEventListener('pointerleave',()=>{if(!drag&&!pan){hover=null;render();}});svg.addEventListener('pointerup',()=>{drag=null;pan=null;render();});
  svg.addEventListener('dblclick',e=>{if(mode!=='select')return;const p=dataPoint(e),hit=hitTest(p);if(!hit||!['contact','vertex'].includes(hit.type)||contacts[hit.ci].bloqueado)return;e.preventDefault();pushHistory();const q=snapped(p,e.altKey),idx=nearestSegmentIndex(contacts[hit.ci],q);contacts[hit.ci].vertices.splice(idx,0,q);selection={type:'vertex',ci:hit.ci,vi:idx};markDirty(true);syncProperties();render();});svg.addEventListener('wheel',e=>{e.preventDefault();const p=dataPoint(e),f=e.deltaY>0?1.15:.87;viewport={xmin:p.s_m+(viewport.xmin-p.s_m)*f,xmax:p.s_m+(viewport.xmax-p.s_m)*f,ymin:p.z_m+(viewport.ymin-p.z_m)*f,ymax:p.z_m+(viewport.ymax-p.z_m)*f};render();},{passive:false});
  $('selectBtn').onclick=()=>setMode('select');$('drawBtn').onclick=()=>{draft=[];selection=null;setMode('draw');};$('lensBtn').onclick=()=>{draft=[];selection=null;setMode('lens');};$('paintBtn').onclick=()=>setMode('paint');$('finishBtn').onclick=finalizeDraft;$('fitBtn').onclick=()=>{viewport=clone(initialBounds);render();};$('snapBtn').onclick=()=>{snap=!snap;$('snapBtn').classList.toggle('active',snap);};
  $('undoBtn').onclick=()=>{if(history.length){future.push(snapshot());restore(history.pop());}};$('redoBtn').onclick=()=>{if(future.length){history.push(snapshot());restore(future.pop());}};$('deleteBtn').onclick=deleteSelection;$('splitBtn').onclick=splitContact;$('joinBtn').onclick=()=>{if(selectedContact()){setMode('join');joinBase=selection.ci;}};
  $('clearBtn').onclick=()=>{if(!(contacts.length||zones.length)||!confirm('Se eliminaran todos los contactos y rellenos. Los sondeos y DPSH se conservaran.'))return;pushHistory();contacts=[];zones=[];selection=null;topologyDirty=false;clearedAll=true;markDirty();syncProperties();render();};$('panelBtn').onclick=()=>{$('panel').classList.toggle('hidden');buildPanel();};$('closePanel').onclick=()=>$('panel').classList.add('hidden');
  $('nameInput').onchange=e=>{const c=selectedContact();if(c&&!c.bloqueado){pushHistory();c.nombre=e.target.value;markDirty();render();}};$('colorInput').onchange=e=>{const c=selectedContact();if(c&&!c.bloqueado){pushHistory();c.color=e.target.value;markDirty();render();}};$('evidenceSelect').onchange=e=>{const c=selectedContact();if(c&&!c.bloqueado){pushHistory();c.evidencia=e.target.value;markDirty();render();}};$('uncertaintyInput').onchange=e=>{const c=selectedContact();if(c&&!c.bloqueado){pushHistory();c.incertidumbre_m=Math.max(0,Number(e.target.value)||0);markDirty();render();}};$('unitSelect').onchange=e=>{const c=selectedContact();if(mode==='select'&&c&&!c.bloqueado){pushHistory();c.unidad_inferior=e.target.value;markDirty();}};
  $('saveBtn').onclick=()=>{setValue({action:'save',event_id:Date.now(),contactos:contacts,zonas:zones,limpiar_interpretacion:clearedAll});dirty=false;$('state').textContent='Guardado enviado a Python';$('state').className='';lastModelSignature='';};window.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='Delete'){e.preventDefault();deleteSelection();}else if(e.key==='Escape'){draft=[];setMode('select');}else if(e.key==='Enter'&&['draw','lens'].includes(mode))finalizeDraft();else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('undoBtn').click();}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('redoBtn').click();}});
